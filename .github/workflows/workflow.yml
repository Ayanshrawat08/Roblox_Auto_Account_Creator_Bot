name: Build, Lint & Publish (Multi-OS)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 🔹 Version Auto Increment (only once, not for all OS)
      - name: Get and increment version
        id: get_version
        if: matrix.os == 'windows-latest'
        run: |
          $version = Get-Content version.txt -Raw
          $version = $version.Trim()

          if ($version -match '^v(\d+)\.(\d+)(?:\.(\d+))?$') {
            $major = [int]$matches[1]
            $minor = [int]$matches[2]
            $patch = if ($matches[3]) { [int]$matches[3] } else { 0 }

            $patch++
            $newVersion = "v$major.$minor.$patch"
            $newVersion | Out-File -FilePath version.txt -NoNewline -Encoding UTF8
            echo "VERSION=$newVersion" >> $env:GITHUB_OUTPUT
          } else {
            echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Share version across jobs
        id: version_all
        run: |
          if [ -f version.txt ]; then
            echo "VERSION=$(cat version.txt)" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # 🔹 Commit version (only once)
      - name: Commit version update
        if: matrix.os == 'windows-latest'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "Bump version [skip ci]" || echo "No changes"
          git push
        shell: pwsh

      # 🔹 Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      # 🔹 Lint (optional but pro)
      - name: Lint with flake8
        run: |
          flake8 . || true

      # 🔥 BUILD FOR ALL OS
      - name: Build executable
        run: |
          echo "__version__ = '${{ steps.version_all.outputs.VERSION }}'" > version.py

          if [ "$RUNNER_OS" == "Windows" ]; then
            pyinstaller --onefile --clean --name "roblox-auto-signup-windows.exe" main.py
          elif [ "$RUNNER_OS" == "macOS" ]; then
            pyinstaller --onefile --clean --name "roblox-auto-signup-mac" main.py
          else
            pyinstaller --onefile --clean --name "roblox-auto-signup-linux" main.py
          fi
        shell: bash

      # 📦 Upload artifacts (for all OS)
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/

  # 🚀 CREATE RELEASE (only once)
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4

      - name: Read version
        id: version
        run: |
          echo "VERSION=$(cat build-windows-latest/version.txt 2>/dev/null || echo v1.0.0)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          files: |
            build-windows-latest/*
            build-ubuntu-latest/*
            build-macos-latest/*
          body: |
            🚀 Multi-platform release

            ✅ Windows (.exe)
            ✅ macOS
            ✅ Linux

            Built automatically using GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
